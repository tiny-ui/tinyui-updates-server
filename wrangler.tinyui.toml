# The hosted instance updates.tinyui.app: `wrangler deploy --config wrangler.tinyui.toml`.
# Self-hosting uses wrangler.toml; nothing here is a secret, the domain is public.
name = "tinyui-updates"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = false

routes = [
    { pattern = "updates.tinyui.app", custom_domain = true },
]

[observability]
enabled = true

[vars]
MAX_OBJECT_BYTES = "16777216"

[[r2_buckets]]
binding = "CONTENT"
bucket_name = "tinyui-updates"
